<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تطبيق الزبون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f6fb;--ink:#101828;--mut:#667085;--pri:#2457f5;--ok:#17a05d;--no:#e5484d;--card:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.s{display:none;min-height:100vh;padding:20px 16px 90px}.s.on{display:block}
h1{font-size:30px;font-weight:900}h2{font-size:20px;margin-bottom:14px}
.hero{padding:60px 0 30px}.hero p{color:var(--mut);margin-top:6px}
button{font:inherit;border:0;border-radius:14px;padding:15px;font-weight:700;width:100%;cursor:pointer;background:var(--pri);color:#fff;margin-top:12px}
button.g{background:#e7ecfb;color:var(--pri)}button.ok{background:var(--ok)}button.no{background:var(--no)}
input{font:inherit;width:100%;padding:15px;border:1.5px solid #d9deea;border-radius:14px;margin-top:12px;background:#fff}
input:focus{outline:0;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #1018280d;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#e5e9f3;display:block}
.card div{padding:10px 12px}.card b{display:block}.card span{color:var(--pri);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top button{width:auto;margin:0;padding:9px 14px}
.tabs{position:fixed;bottom:0;inset-inline:0;display:flex;background:#fff;border-top:1px solid #e4e7ec;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;color:var(--mut);margin:0;border-radius:0}.tabs .on{color:var(--pri)}
.sheet{position:fixed;inset:0;background:#10182899;display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.qty{display:flex;align-items:center;justify-content:center;gap:24px;margin:16px 0;font-size:30px;font-weight:900}
.qty button{width:52px;margin:0;padding:8px;font-size:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#map{height:calc(100vh - 170px);border-radius:18px}
.pin{position:absolute;left:50%;top:calc(50% + 60px);font-size:36px;transform:translate(-50%,-100%);z-index:500;pointer-events:none}
.o{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}.o small{color:var(--mut)}
#ms{height:calc(100vh - 190px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:10px 14px;border-radius:18px;background:#fff;align-self:flex-start}.b.me{background:var(--pri);color:#fff;align-self:flex-end}
.cb{display:flex;gap:8px;position:fixed;bottom:0;inset-inline:0;padding:10px;background:#fff}.cb input{margin:0}.cb button{width:90px;margin:0}
.err{color:var(--no);margin-top:10px;min-height:22px}
</style></head><body>

<section id="auth" class="s on"><div class="hero"><h1>أهلاً بك 👋</h1><p>تسوّق واطلب بضغطة وحدة</p></div>
<button onclick="show('reg')">زبون جديد</button><button class="g" onclick="show('log')">لدي حساب</button></section>

<section id="reg" class="s"><h2>حساب جديد</h2>
<input id="rn" placeholder="الاسم"><input id="rp" type="tel" placeholder="رقم الهاتف"><input id="rc" type="tel" maxlength="4" placeholder="رمز من 4 أرقام">
<div class="err" id="re"></div><button onclick="reg()">حفظ</button><button class="g" onclick="show('auth')">رجوع</button></section>

<section id="log" class="s"><h2>تسجيل الدخول</h2>
<input id="lp" type="tel" placeholder="رقم الهاتف"><input id="lc" type="tel" maxlength="4" placeholder="الرمز">
<div class="err" id="le"></div><button onclick="login()">دخول</button><button class="g" onclick="show('auth')">رجوع</button></section>

<section id="shop" class="s"><div class="top"><h2 id="hi" style="margin:0"></h2><button class="g" onclick="out()">خروج</button></div>
<div class="grid" id="offers"></div></section>

<section id="ords" class="s"><h2>طلباتي</h2><div id="ol"></div></section>

<section id="mapS" class="s"><h2>حدّد موقعك</h2><div style="position:relative"><div id="map"></div><div class="pin">📍</div></div>
<div class="row"><button class="g" onclick="locate()">موقعي الحالي</button><button class="ok" onclick="send()">إرسال الطلب</button></div></section>

<section id="chat" class="s"><div class="top"><h2 id="ct" style="margin:0"></h2><button class="g" onclick="show('ords')">رجوع</button></div>
<div id="ms"></div><div class="cb"><input id="cm" placeholder="اكتب رسالة"><button onclick="sendMsg()">إرسال</button></div></section>

<div class="tabs" id="tabs" style="display:none"><button id="t1" class="on" onclick="show('shop')">العروض</button><button id="t2" onclick="show('ords')">طلباتي</button></div>

<div class="sheet" id="sh"><div><h2 id="sn"></h2><div id="spz" style="color:var(--pri);font-weight:700"></div>
<div class="qty"><button class="g" onclick="q(1)">+</button><span id="q">1</span><button class="g" onclick="q(-1)">−</button></div>
<div class="row"><button class="ok" onclick="toMap()">تأكيد</button><button class="no" onclick="$('sh').classList.remove('on')">إلغاء</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ===== ضع إعدادات Firebase هنا =====
const CFG={apiKey:"AIzaSyBWSLi4ehDjmO1j1R7r7-kFENVVg8UGBRk",authDomain:"ccccccccvb.firebaseapp.com",projectId:"ccccccccvb",storageBucket:"ccccccccvb.firebasestorage.app",messagingSenderId:"730885629435",appId:"1:730885629435:web:e8e56f1efdb87238ee975e"};
firebase.initializeApp(CFG);const db=firebase.firestore();
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let me=null,offers={},cur=null,qty=1,map=null,unsub=null,oid=null;
function show(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));
 const t=['shop','ords'].includes(id);$('tabs').style.display=t?'flex':'none';$('t1').classList.toggle('on',id=='shop');$('t2').classList.toggle('on',id=='ords');scrollTo(0,0)}
async function reg(){const n=$('rn').value.trim(),p=$('rp').value.trim(),c=$('rc').value.trim();
 if(!n||!p||!/^\d{4}$/.test(c))return $('re').textContent='املأ كل الحقول، والرمز 4 أرقام';
 try{const r=db.collection('customers').doc(p);if((await r.get()).exists)return $('re').textContent='هذا الرقم مسجل، اضغط "لدي حساب"';
 await r.set({name:n,code:c});enter({phone:p,name:n})}catch(e){$('re').textContent='تعذر الحفظ، تحقق من الاتصال'}}
async function login(){const p=$('lp').value.trim(),c=$('lc').value.trim();
 try{const d=await db.collection('customers').doc(p).get();if(!d.exists||d.data().code!==c)return $('le').textContent='الرقم أو الرمز غير صحيح';
 enter({phone:p,name:d.data().name})}catch(e){$('le').textContent='تعذر الدخول، تحقق من الاتصال'}}
function enter(u){me=u;localStorage.setItem('cu',JSON.stringify(u));$('hi').textContent='هلا '+u.name;show('shop');
 db.collection('offers').orderBy('t','desc').onSnapshot(s=>{offers={};$('offers').innerHTML=s.docs.map(d=>{const o=d.data();offers[d.id]=o;
 return `<div class="card" onclick="pick('${d.id}')"><img src="${o.img||''}"><div><b>${esc(o.name)}</b><span>${esc(o.price)}</span></div></div>`}).join('')||'<p style="color:var(--mut)">لا توجد عروض حالياً</p>'});
 db.collection('orders').where('phone','==',u.phone).onSnapshot(s=>{$('ol').innerHTML=s.docs.map(d=>d.data()).length?s.docs.sort((a,b)=>(b.data().t?.seconds||0)-(a.data().t?.seconds||0)).map(d=>{const o=d.data();
 return `<div class="o"><b>${esc(o.offer)}</b> × ${o.qty}<br><small>${esc(o.price)}</small><button class="g" onclick="openChat('${d.id}')">دردشة مع البائع</button></div>`}).join(''):'<p style="color:var(--mut)">ما عندك طلبات بعد</p>'})}
function out(){localStorage.removeItem('cu');location.reload()}
function pick(id){cur=id;qty=1;$('q').textContent=1;$('sn').textContent=offers[id].name;$('spz').textContent=offers[id].price;$('sh').classList.add('on')}
function q(n){qty=Math.max(1,qty+n);$('q').textContent=qty}
function toMap(){$('sh').classList.remove('on');show('mapS');
 if(!map){map=L.map('map',{zoomControl:false}).setView([33.3152,44.3661],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);locate()}
 setTimeout(()=>map.invalidateSize(),100)}
function locate(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>{},{enableHighAccuracy:true})}
async function send(){const c=map.getCenter(),o=offers[cur];
 await db.collection('orders').add({phone:me.phone,name:me.name,offer:o.name,price:o.price,qty,lat:c.lat,lng:c.lng,t:firebase.firestore.FieldValue.serverTimestamp()});
 alert('تم إرسال طلبك ✅');show('ords')}
function openChat(id){oid=id;$('ct').textContent='دردشة';show('chat');unsub&&unsub();
 unsub=db.collection('orders').doc(id).collection('m').orderBy('t').onSnapshot(s=>{$('ms').innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="b ${m.f=='c'?'me':''}">${esc(m.x)}</div>`}).join('');$('ms').scrollTop=1e9})}
async function sendMsg(){const x=$('cm').value.trim();if(!x)return;$('cm').value='';
 await db.collection('orders').doc(oid).collection('m').add({f:'c',x,t:firebase.firestore.FieldValue.serverTimestamp()})}
try{const u=JSON.parse(localStorage.getItem('cu'));u&&enter(u)}catch(e){}
</script></body></html>
